name: Refresh dashboard

# Rebuilds data/snapshot.js from the four upstream repos and publishes the site.
#
# Nothing in the source repos can trigger this: a workflow only responds to
# events in its own repository. So the schedule is the update mechanism, and the
# dashboard is stale by up to one interval. Use workflow_dispatch when a change
# needs to land sooner.
#
# The minute is deliberately not :00 -- GitHub delays scheduled runs under load
# and drops them outright at popular times, of which the top of the hour is the
# worst. Note also that scheduled workflows are disabled automatically after 60
# days with no activity in this repository.
on:
  schedule:
    - cron: '17 * * * *'        # hourly, at 17 minutes past
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dashboard
        uses: actions/checkout@v4

      - name: Check out oac-apps (the cluster configuration)
        uses: actions/checkout@v4
        with:
          repository: CCI-MOC/oac-apps
          path: .upstream/oac-apps
          fetch-depth: 1
          # A public repo needs no token. For a private one, add a PAT with
          # read access as OAC_APPS_TOKEN and uncomment:
          # token: ${{ secrets.OAC_APPS_TOKEN }}

      - name: Check out ansible-switches (VLANs and switch ports)
        uses: actions/checkout@v4
        with:
          repository: CCI-MOC/ansible-switches
          path: .upstream/ansible-switches
          fetch-depth: 1

      - name: Check out open-accelerator-infra (node inventory and CIDRs)
        uses: actions/checkout@v4
        with:
          repository: CCI-MOC/open-accelerator-infra
          path: .upstream/open-accelerator-infra
          fetch-depth: 1

      - name: Check out moc-keycloak (identity configuration)
        uses: actions/checkout@v4
        with:
          repository: CCI-MOC/moc-keycloak
          path: .upstream/moc-keycloak
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # Repo-derived data only. Issue-derived and curated content is in
      # data/analysis.js, which a person regenerates via ANALYSIS.md and commits;
      # this job must not touch it.
      - name: Build the snapshot
        run: |
          python3 tools/build_snapshot.py \
            --oac-apps .upstream/oac-apps \
            --ansible-switches .upstream/ansible-switches \
            --infra .upstream/open-accelerator-infra \
            --keycloak .upstream/moc-keycloak \
            --out data/snapshot.js

      - name: Fail if the snapshot came out empty
        run: |
          python3 - <<'PY'
          import json, re, sys
          src = open('data/snapshot.js').read()
          data = json.loads(re.sub(r'^.*?window\.MOC_DATA = ', '', src, flags=re.S).rstrip().rstrip(';'))
          problems = []
          if not data['clusters']:            problems.append('no clusters parsed')
          if not data['charts']:              problems.append('no charts parsed')
          if not data.get('network', {}).get('cidrs'):
              problems.append('no VLAN/CIDR rows parsed')
          if not (data.get('identity') or {}).get('realm'):
              problems.append('no keycloak realm parsed')
          if not data.get('fleet'):
              problems.append('no hardware inventory parsed')
          if problems:
              sys.exit('snapshot looks wrong: ' + '; '.join(problems))
          print(f"ok: {len(data['clusters'])} clusters, {len(data['charts'])} charts, "
                f"{len(data['fleet'])} machines, {len(data['network']['cidrs'])} networks")
          PY

      - name: Package the site
        run: |
          rm -rf .upstream _site
          mkdir _site
          cp -r index.html assets data _site/
          test -f _site/data/analysis.js || echo "::warning::data/analysis.js is missing; \
            issue-derived sections will render empty. Regenerate it per ANALYSIS.md."
          # Pages serves assets with a ten-minute max-age, so a returning
          # viewer can be handed a cached snapshot.js that predates this run.
          # Stamping the reference means a refreshed index.html always pulls
          # the data published alongside it.
          stamp=$(date -u +%Y%m%d%H%M%S)
          sed -i "s|data/snapshot\.js|data/snapshot.js?v=$stamp|" _site/index.html
          grep -o 'data/snapshot\.js?v=[0-9]*' _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
